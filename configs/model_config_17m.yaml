# ---- MODEL SHAPE (the "size" of the brain) ----
vocab_size: 8000        # how many different tokens (word pieces) the model knows
dim: 384                # width of every vector inside the model
num_layers: 8           # how many transformer blocks stacked
num_heads: 6            # attention heads (dim / heads = 64 numbers per head)
ffn_dim: 1024           # hidden size inside the feed-forward (SwiGLU) part
context_length: 512     # how many tokens the model can look at once
rope_theta: 10000.0     # RoPE base number
norm_eps: 0.00001       # tiny number to avoid dividing by zero in RMSNorm

# ---- TRAINING SETTINGS ----
batch_size: 8           # sequences per step (lower this if GPU memory runs out)
grad_accum: 4           # add up gradients over this many steps => effective batch 32
pretrain_lr: 0.0006
sft_lr: 0.0003
min_lr_ratio: 0.1       # LR ends at 10% of the peak
warmup_steps: 200
weight_decay: 0.1
grad_clip: 1.0
pretrain_epochs: 3        # more data now, fewer passes needed
sft_epochs: 4
eval_every: 250
save_every: 500
